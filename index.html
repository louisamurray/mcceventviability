<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Calculators</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
</head>
<body>
  
  <div id="container">
    
    <div class="dropdown">
      <label for="inputSelect">I know my:</label>
      <select id="inputSelect" onchange="updateOutputOptions()">
        <option value="">Select</option>
        <option value="ticketPrice">Ticket Price</option>
        <option value="profitMargin">Profit Margin</option>
      </select>
    </div>
    
    <div class="dropdown">
      <label for="outputSelect">I need to know my:</label>
      <select id="outputSelect">
        <option value="">Select</option>
      </select>
    </div>
    
    <button onclick="openCalculator()">Calculate</button>
  </div>

  <div id="ticketModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('ticketModal')">&times;</span>
      <iframe src="Ticket.html"></iframe>
    </div>
  </div>

  <div id="profitModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('profitModal')">&times;</span>
      <iframe src="Profit.html"></iframe>
    </div>
  </div>

  <div id="minimumTicketsModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('minimumTicketsModal')">&times;</span>
      <iframe src="MinimumTickets.html"></iframe>
    </div>
  </div>

  <script>
    function updateOutputOptions() {
      const inputSelect = document.getElementById('inputSelect').value;
      const outputSelect = document.getElementById('outputSelect');
      
      // Clear the current options
      outputSelect.innerHTML = '<option value="">Select</option>';

      // Populate options based on the input selection
      if (inputSelect === 'ticketPrice') {
        outputSelect.innerHTML += '<option value="minimumSales">Minimum Sales</option>';
        outputSelect.innerHTML += '<option value="profitMargin">Profit Margin</option>';
      } else if (inputSelect === 'profitMargin') {
        outputSelect.innerHTML += '<option value="minimumSales">Minimum Sales</option>';
        outputSelect.innerHTML += '<option value="ticketPrice">Ticket Price</option>';
      }
    }

    function openCalculator() {
      const inputSelect = document.getElementById('inputSelect').value;
      const outputSelect = document.getElementById('outputSelect').value;

      if (inputSelect === 'ticketPrice' && outputSelect === 'minimumSales') {
        openModal('minimumTicketsModal');
      } else if (inputSelect === 'ticketPrice' && outputSelect === 'profitMargin') {
        openModal('profitModal');
      } else if (inputSelect === 'profitMargin' && outputSelect === 'minimumSales') {
        openModal('minimumTicketsModal');
      } else if (inputSelect === 'profitMargin' && outputSelect === 'ticketPrice') {
        openModal('ticketModal');
      }
    }

    function openModal(modalId) {
      document.getElementById(modalId).style.display = "block";
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = "none";
    }

    window.onclick = function(event) {
      if (event.target.className === 'modal') {
        event.target.style.display = "none";
      }
    }
  </script>
</body>
</html>
