<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Calculators</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
  <style>
  </style>
</head>
<body>
  <div id="container">
    <button onclick="openModal('ticketModal')">Open Ticket Calculator</button>
    <button onclick="openModal('profitModal')">Open Profit Calculator</button>
    <button onclick="openModal('minimumTicketsModal')">Open Minimum Tickets Calculator</button>
  </div>

  <div id="ticketModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('ticketModal')">&times;</span>
      <iframe src="Ticket.html"></iframe>
    </div>
  </div>

  <div id="profitModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('profitModal')">&times;</span>
      <iframe src="Profit.html"></iframe>
    </div>
  </div>

  <div id="minimumTicketsModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('minimumTicketsModal')">&times;</span>
      <iframe src="MinimumTickets.html"></iframe>
    </div>
  </div>

  <script>
    function openModal(modalId) {
      document.getElementById(modalId).style.display = "block";
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = "none";
    }

    window.onclick = function(event) {
      if (event.target.className === 'modal') {
        event.target.style.display = "none";
      }
    }
  </script>
</body>
</html>
